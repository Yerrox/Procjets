<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moduł Weryfikacji Zamówień</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>

    <main id="kontener-glowny">
        <header>
            <h1>System Obsługi Klienta <span>v.3.0</span></h1>
        </header>

        <div class="uklad-kolumnowy">
            <section id="panel-danych">
                <h2>Dane Zamówienia</h2>
                
                <div class="wiersz">
                    <label for="dane-klienta">Imię i nazwisko:</label>
                    <input type="text" id="dane-klienta" placeholder="Wprowadź dane klienta">
                </div>
                
                <div class="wiersz">
                    <label for="kod-promo">Kod promocyjny:</label>
                    <input type="text" id="kod-promo" placeholder="Wprowadź kod">
                </div>
                
                <div class="wiersz">
                    <label for="wartosc">Wartość zamówienia (PLN):</label>
                    <input type="number" step="0.01" id="wartosc" placeholder="0.00">
                </div>
                
                <button type="button" id="btn-weryfikuj">Weryfikuj Zamówienie</button>
            </section>

            <section id="panel-wynikow">
                <h2>Karta Podsumowania</h2>
                
                <div class="wynik-wiersz status-wiersz">
                    <span>Status weryfikacji:</span>
                    <strong id="wynik-status">Oczekiwanie na dane</strong>
                </div>

                <div class="wynik-wiersz">
                    <span>Wygenerowany ID Klienta:</span>
                    <strong id="identyfikator">-</strong>
                </div>

                <div class="wynik-wiersz">
                    <span>Ostateczna kwota do zapłaty:</span>
                    <strong id="kwota">-</strong>
                </div>

                <div class="wynik-wiersz">
                    <span>Kod po weryfikacji (cenzura):</span>
                    <strong id="cenzura">-</strong>
                </div>
            </section>
        </div>
    </main>

    <script src="skrypt.js"></script>
</body>
</html>
