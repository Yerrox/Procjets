<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watomierz</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>

    <div id="interfejs-glowny">
        <header>
            <h1>Watomierz v1.0- Diagnostyka</h1>
        </header>

        <main>
            <section id="lewa">
                <h2>Rejestruj Urządzenie</h2>
                <form method="post">
                    <p>
                        <label for="sprzet">Nazwa sprzętu:</label>
                        <input type="text" name="sprzet" id="sprzet">
                    </p>

                    <p>
                        <label for="pobor">Pobór mocy (w watach):</label>
                        <input type="number" name="pobor" id="pobor">
                    </p>

                    <p>
                        <label for="czas">Czas pracy w godzinach:</label>
                        <input type="number" name="czas" id="czas">
                    </p>

                    <button type="button">Oblicz i Zapisz</button>
                </form>
            </section>
            <section id="prawa">
                <h2>Zestawienie Poboru</h2>
                <table id="tab">
                    <thead>
                        <tr>
                            <th>Urządzenie</th>
                            <th>Zużycie (kWh)</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>

                    </tbody>
                    <tfoot>

                    </tfoot>
                </table>

                <p id="wynik">Brak danych z czujników</p>
            </section>
        </main>
    </div>

    <script src="skrypt.js"></script>
</body>
</html>
