<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacja Sejsmologiczna</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>

    <div id="aplikacja">
        <header>
            <h1>Centrala Sejsmologiczna <span>v2.0</span></h1>
        </header>

        <main>
            <section class="panel-rejestracji">
                <h2>Rejestracja Wstrząsu</h2>
                
                <form id="formularz-wstrzasu">
                    <div class="pole">
                        <label for="rejon">Rejon wystąpienia (Kod strefy):</label>
                        <input type="text" id="rejon" placeholder="np. Sektor-7">
                    </div>

                    <div class="pole">
                        <label for="amplituda">Amplituda (w skali Richtera):</label>
                        <input type="number" id="amplituda" step="0.1" placeholder="np. 4.5">
                    </div>

                    <div class="pole">
                        <label for="czas">Czas trwania (w sekundach):</label>
                        <input type="number" id="czas" placeholder="np. 15">
                    </div>

                    <button type="button" id="btn-zapisz">Zapisz Odczyt</button>
                </form>
            </section>

            <section class="panel-raportow">
                <h2>Zestawienie Odczytów</h2>
                
                <table id="tabela-odczytow">
                    <thead>
                        <tr>
                            <th>Rejon</th>
                            <th>Amplituda</th>
                            <th>Skumulowana Energia</th>
                        </tr>
                    </thead>
                    <tbody id="cialo-tabeli">
                        
                    </tbody>
                </table>

                <div class="podsumowanie">
                    <h3>Raport Systemowy</h3>
                    <p id="statystyki">Oczekiwanie na pierwsze dane z czujników...</p>
                </div>
            </section>
        </main>
    </div>

    <script src="skrypt.js"></script>
</body>
</html>
